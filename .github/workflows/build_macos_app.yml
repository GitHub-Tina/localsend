name: Build macOS app (arm64)

on:
  workflow_dispatch:
  push:
    branches:
      - fix-macos-missingplugin-1.18.2

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Check rust-toolchain.toml
        working-directory: packages/localsend_isolates
        run: rustup show

      - name: CocoaPods
        run: which pod || brew install cocoapods

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Switch to ad-hoc code signing (no Apple developer certificate on CI)
        working-directory: app/macos
        run: |
          sed -i '' \
            -e '/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]"/d' \
            -e 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "-";/' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e '/DEVELOPMENT_TEAM = /d' \
            Runner.xcodeproj/project.pbxproj

      - name: Build macOS
        working-directory: app
        run: flutter build macos --release

      - name: Re-sign ad-hoc (fix LaunchAtLoginHelper seal broken by build phase)
        run: codesign --force --deep -s - app/build/macos/Build/Products/Release/LocalSend.app

      - name: Package
        run: |
          cd "$GITHUB_WORKSPACE/app/build/macos/Build/Products/Release"
          ditto -c -k --sequesterRsrc --keepParent LocalSend.app "$GITHUB_WORKSPACE/LocalSend-${{ steps.get_version.outputs.version }}-macos-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-app-arm64-result
          path: LocalSend-*-macos-arm64.zip
